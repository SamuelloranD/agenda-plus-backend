name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Run backend tests
        env:
          # Chave pública exclusiva dos testes com banco descartável; nunca usar em produção.
          TEST_JWT_SECRET: agenda-plus-ci-chave-exclusiva-de-testes-1234567890
        run: ./mvnw -B test
