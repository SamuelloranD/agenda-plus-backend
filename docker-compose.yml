services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda_plus}
      POSTGRES_USER: ${POSTGRES_USER:-agenda_plus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda_plus}
    ports:
      - "5432:5432"
    volumes:
      - agenda-plus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Enable this service when running the complete stack with Docker.
  # backend:
  #   build: .
  #   environment:
  #     DB_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
  #     DB_USERNAME: $${POSTGRES_USER}
  #     DB_PASSWORD: $${POSTGRES_PASSWORD}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  agenda-plus-postgres: